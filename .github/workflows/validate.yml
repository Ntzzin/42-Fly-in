name: Validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run flake8
        run: uv run flake8 . --exclude .venv --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s %(text)s'

      - name: Run mypy
        run: |
          uv run mypy . --show-column-numbers --no-error-summary --strict | \
          sed -E 's/^(.+):([0-9]+):([0-9]+): error: (.*)$/::error file=\1,line=\2,col=\3::\4/'

      - name: Run unit tests
        run: uv run pytest