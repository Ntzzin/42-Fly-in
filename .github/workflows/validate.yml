name: Validate

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install flake8
        run: pip install flake8

      - name: Install mypy
        run: pip install mypy

      - name: Run flake8
        run: flake8 . --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s %(text)s'

      - name: Run mypy
        run: |
          mypy . --show-column-numbers --no-error-summary --strict | \
          sed -E 's/^(.+):([0-9]+):([0-9]+): error: (.*)$/::error file=\1,line=\2,col=\3::\4/'

