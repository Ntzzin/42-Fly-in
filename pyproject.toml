[project]
name = "Fly-in"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ntzzin", email = "nytgrab@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "fly_in"

[flake8]
exclude = [".venv,.git,__pycache__,.mypy_cache"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
ide = [
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.lint]
preview = true
select = ["E", "W", "F4", "F8"]
ignore = [
    "E204", "E252", "W505", "F406", "F407", "F842"
]
